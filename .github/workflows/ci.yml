name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: newer stable releases deprecate package:flutter/material.dart
          # (use package:material_ui) and flutter analyze fails on it. Unpin
          # once the app has migrated.
          flutter-version: 3.47.4
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
