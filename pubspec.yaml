name: freebeamer_mobile
description: >
  FreeBeamer client app: connects to a vehicle's MHD/ENET WiFi adapter,
  reads live MHD monitor data over DoIP/UDS, and relays it to a
  FreeBeamer relay service. See https://github.com/freebeamer/core/blob/main/docs/freebeamer-relay-v0-plan.md and
  https://github.com/freebeamer/core/blob/main/docs/mhd-live-monitor-v0-plan.md.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  wakelock_plus: ^1.2.8
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  equatable: ^2.0.5
  app_links: ^6.3.2
  crypto: ^3.0.3
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
